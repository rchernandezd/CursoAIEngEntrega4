[pytest]
pythonpath = .
markers =
    integration: requiere red, PINECONE_API_KEY y descarga del modelo de embeddings
# cacheprovider desactivado: OneDrive bloquea el rename atómico de .pytest_cache en Windows
addopts = -m "not integration" -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:langchain_community.*
    ignore:.*langchain-community.*:DeprecationWarning
